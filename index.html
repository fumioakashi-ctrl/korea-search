<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>カレンダー検索</title>
    
    <!-- スマホのステータスバーの色を設定 -->
    <meta name="theme-color" content="#4f46e5">

    <!-- Google API スクリプト -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            /* テキスト選択を防止してアプリっぽくする */
            user-select: none;
            -webkit-user-select: none;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        @media (min-width: 481px) {
            .app-container {
                min-height: 800px;
                margin-top: 2rem;
                margin-bottom: 2rem;
                border-radius: 1.5rem;
                overflow: hidden;
            }
        }
    </style>
</head>
<body>

<div class="app-container flex flex-col relative">
    <!-- ヘッダー -->
    <header class="bg-indigo-600 text-white p-4 shadow-md z-10">
        <h1 class="text-xl font-bold text-center"><i class="far fa-calendar-alt mr-2"></i>カレンダー検索</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow p-6 flex flex-col gap-6 overflow-y-auto">
        <!-- 認証UI -->
        <div class="bg-yellow-50 p-4 rounded-xl border border-yellow-200 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-sm text-yellow-800 font-medium">
                <i class="fas fa-info-circle mr-1"></i>
                <span id="authStateText">検索するにはGoogleアカウントでログインしてください。</span>
            </div>
            <button id="authBtn" class="px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm text-sm font-bold text-gray-700 hover:bg-gray-50 transition duration-150 active:scale-95">
                Googleでログイン
            </button>
        </div>

        <div class="bg-gray-50 p-5 rounded-2xl shadow-sm border border-gray-100">
            <label for="searchInput" class="block text-sm font-medium text-gray-700 mb-2">検索キーワードを入力</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-search text-gray-400"></i>
                </div>
                <!-- ユーザーが文字入力できるようにここは選択可能に -->
                <input type="text" id="searchInput" style="user-select: auto; -webkit-user-select: auto;"
                    class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl leading-5 bg-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-150 ease-in-out" 
                    placeholder="例: 韓国ドラマ...">
            </div>
            <p id="errorMsg" class="hidden mt-2 text-sm text-red-600 font-medium"></p>
            <button id="searchBtn" disabled
                class="mt-4 w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition duration-150 active:scale-95">
                検索開始
            </button>
        </div>

        <div id="loading" class="hidden flex flex-col items-center justify-center py-8">
            <i class="fas fa-circle-notch fa-spin text-3xl text-indigo-500 mb-4"></i>
            <p class="text-gray-500 text-sm">検索中...</p>
        </div>

        <div id="resultsArea" class="hidden flex-col gap-4">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="bg-blue-50 px-4 py-3 border-b border-blue-100 flex items-center gap-2">
                    <i class="far fa-calendar-alt text-blue-600"></i>
                    <h2 class="font-semibold text-gray-800">Google カレンダー</h2>
                </div>
                <div id="calendarResults" class="p-4"></div>
            </div>
        </div>
    </main>
</div>

<script>
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const loading = document.getElementById('loading');
    const resultsArea = document.getElementById('resultsArea');
    const calendarResults = document.getElementById('calendarResults');
    const errorMsg = document.getElementById('errorMsg');
    const authBtn = document.getElementById('authBtn');
    const authStateText = document.getElementById('authStateText');

    // ★Googleカレンダー検索用のクライアントID設定
    const CLIENT_ID = '535628584124-kqdvuc84d8350j7oe2ac6go4o1q41odg.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/calendar.readonly';
    
    let accessToken = null;
    let tokenClient;

    window.onload = function () {
        try {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse.error !== undefined) throw (tokenResponse);
                    accessToken = tokenResponse.access_token;
                    
                    authStateText.textContent = '連携完了。検索可能です。';
                    authStateText.classList.replace('text-yellow-800', 'text-green-700');
                    authStateText.parentElement.parentElement.classList.replace('bg-yellow-50', 'bg-green-50');
                    authStateText.parentElement.parentElement.classList.replace('border-yellow-200', 'border-green-200');
                    authBtn.textContent = '再選択';
                    searchBtn.disabled = false;
                },
            });
        } catch (e) {
            console.error('初期化エラー:', e);
        }
    };

    authBtn.addEventListener('click', () => {
        if (CLIENT_ID.includes('★')) {
            alert('【設定エラー】CLIENT_ID が設定されていません。');
            return;
        }
        tokenClient.requestAccessToken({prompt: 'consent'});
    });

    searchBtn.addEventListener('click', () => {
        if (!accessToken) return;
        const keyword = searchInput.value.trim();
        errorMsg.classList.add('hidden');

        if (!keyword) {
            errorMsg.textContent = 'キーワードを入力してください。';
            errorMsg.classList.remove('hidden');
            return;
        }
        performSearch(keyword);
    });

    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !searchBtn.disabled) searchBtn.click();
    });

    async function performSearch(keyword) {
        resultsArea.classList.add('hidden');
        loading.classList.remove('hidden');
        calendarResults.innerHTML = '';

        try {
            const calData = await searchCalendar(keyword);
            renderResults(calendarResults, calData);
            resultsArea.classList.remove('hidden');
            resultsArea.classList.add('flex');
        } catch (error) {
            errorMsg.textContent = '検索中にエラーが発生しました。';
            errorMsg.classList.remove('hidden');
        } finally {
            loading.classList.add('hidden');
        }
    }
    
    async function searchCalendar(keyword) {
        const response = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?q=${encodeURIComponent(keyword)}&orderBy=startTime&singleEvents=true`, {
            headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        if (!response.ok) return [];
        const data = await response.json();
        return (data.items || []).map(event => {
            const start = event.start.dateTime || event.start.date;
            const dateObj = new Date(start);
            return {
                title: event.summary || 'タイトルなし',
                date: `${dateObj.getFullYear()}年${dateObj.getMonth()+1}月${dateObj.getDate()}日`
            };
        });
    }

    function renderResults(container, data) {
        if (data.length === 0) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-6 text-gray-400">
                    <i class="far fa-calendar-times text-3xl mb-2 opacity-50"></i>
                    <p class="text-sm">該当なし</p>
                </div>
            `;
            return;
        }
        const ul = document.createElement('ul');
        ul.className = 'divide-y divide-gray-100';
        data.forEach(item => {
            const li = document.createElement('li');
            li.className = 'py-3 flex items-start gap-3';
            const icon = '<div class="mt-0.5 w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center flex-shrink-0"><i class="fas fa-clock text-sm"></i></div>';
            
            li.innerHTML = `${icon}<div><p class="text-sm font-medium text-gray-800">${item.title}</p><p class="text-xs text-gray-500 mt-1">${item.date}</p></div>`;
            ul.appendChild(li);
        });
        container.appendChild(ul);
    }
</script>
</body>
</html>
